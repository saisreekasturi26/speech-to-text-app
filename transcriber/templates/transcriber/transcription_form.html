{% extends "transcriber/base.html" %}

{% block content %}
<div class="card">
  <h2>{% if object %}Edit Transcription{% else %}New Transcription{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save</button>
    <a href="{% url 'transcriber:list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
