{% extends "transcriber/base.html" %}

{% block content %}
<div class="card">
  <h2>Delete Transcription?</h2>
  <p>Are you sure you want to delete "{{ object.title|default:object.text|truncatechars:50 }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'transcriber:list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
